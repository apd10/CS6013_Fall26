<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Parallel matrix addition</title>
  <desc id="desc">Each matrix entry can be added independently in parallel</desc>
  <defs>
    <style>
      .title { font-family: "Space Grotesk", "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #071a33; }
      .label { font-family: "Space Grotesk", "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #071a33; }
      .cell  { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; fill: #152a45; }
      .idx   { font-size: 9px; }
      .cap   { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; fill: #3d5570; }
      .op    { font-family: "Space Grotesk", "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; fill: #0369a1; }
      .arrow { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#ah); }
      .mat-fill { fill: rgba(14, 165, 233, 0.08); }
      .mat-stroke { stroke: #0369a1; stroke-width: 2; fill: none; }
      .hl { fill: rgba(14, 165, 233, 0.32); stroke: #0ea5e9; stroke-width: 1.5; }
      .thread { fill: #fff; stroke: #0369a1; stroke-width: 1.5; }
      .thread-t { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; fill: #0369a1; font-weight: 600; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
  </defs>

  <text class="title" x="460" y="28" text-anchor="middle">One independent add per entry -- launch mn threads</text>

  <!-- Input A (small 3x3) -->
  <g transform="translate(40, 70)">
    <text class="label" x="54" y="-10" text-anchor="middle">A</text>
    <rect class="mat-fill" x="0" y="0" width="108" height="108" rx="4"/>
    <rect class="mat-stroke" x="0" y="0" width="108" height="108" rx="4"/>
    <path d="M36 0 V108 M72 0 V108 M0 36 H108 M0 72 H108" stroke="#0ea5e9" stroke-opacity="0.35"/>
    <rect class="hl" x="0" y="0" width="36" height="36"/>
    <rect class="hl" x="36" y="0" width="36" height="36"/>
    <rect class="hl" x="72" y="0" width="36" height="36"/>
    <rect class="hl" x="0" y="36" width="36" height="36"/>
    <rect class="hl" x="36" y="36" width="36" height="36"/>
    <rect class="hl" x="72" y="36" width="36" height="36"/>
    <rect class="hl" x="0" y="72" width="36" height="36"/>
    <rect class="hl" x="36" y="72" width="36" height="36"/>
    <rect class="hl" x="72" y="72" width="36" height="36"/>
    <text class="cell" x="18" y="23" text-anchor="middle">a00</text>
    <text class="cell" x="54" y="23" text-anchor="middle">a01</text>
    <text class="cell" x="90" y="23" text-anchor="middle">a02</text>
    <text class="cell" x="18" y="59" text-anchor="middle">a10</text>
    <text class="cell" x="54" y="59" text-anchor="middle">a11</text>
    <text class="cell" x="90" y="59" text-anchor="middle">a12</text>
    <text class="cell" x="18" y="95" text-anchor="middle">a20</text>
    <text class="cell" x="54" y="95" text-anchor="middle">a21</text>
    <text class="cell" x="90" y="95" text-anchor="middle">a22</text>
  </g>

  <text class="op" x="178" y="140" text-anchor="middle">+</text>

  <!-- Input B -->
  <g transform="translate(210, 70)">
    <text class="label" x="54" y="-10" text-anchor="middle">B</text>
    <rect class="mat-fill" x="0" y="0" width="108" height="108" rx="4"/>
    <rect class="mat-stroke" x="0" y="0" width="108" height="108" rx="4"/>
    <path d="M36 0 V108 M72 0 V108 M0 36 H108 M0 72 H108" stroke="#0ea5e9" stroke-opacity="0.35"/>
    <rect class="hl" x="0" y="0" width="36" height="36"/>
    <rect class="hl" x="36" y="0" width="36" height="36"/>
    <rect class="hl" x="72" y="0" width="36" height="36"/>
    <rect class="hl" x="0" y="36" width="36" height="36"/>
    <rect class="hl" x="36" y="36" width="36" height="36"/>
    <rect class="hl" x="72" y="36" width="36" height="36"/>
    <rect class="hl" x="0" y="72" width="36" height="36"/>
    <rect class="hl" x="36" y="72" width="36" height="36"/>
    <rect class="hl" x="72" y="72" width="36" height="36"/>
    <text class="cell" x="18" y="23" text-anchor="middle">b00</text>
    <text class="cell" x="54" y="23" text-anchor="middle">b01</text>
    <text class="cell" x="90" y="23" text-anchor="middle">b02</text>
    <text class="cell" x="18" y="59" text-anchor="middle">b10</text>
    <text class="cell" x="54" y="59" text-anchor="middle">b11</text>
    <text class="cell" x="90" y="59" text-anchor="middle">b12</text>
    <text class="cell" x="18" y="95" text-anchor="middle">b20</text>
    <text class="cell" x="54" y="95" text-anchor="middle">b21</text>
    <text class="cell" x="90" y="95" text-anchor="middle">b22</text>
  </g>

  <!-- Arrows to threads -->
  <path class="arrow" d="M340 124 H380"/>

  <!-- Thread pool -->
  <g transform="translate(390, 52)">
    <text class="label" x="110" y="-8" text-anchor="middle">threads (parallel)</text>
    <!-- 3x3 thread boxes -->
    <g>
      <rect class="thread" x="0"   y="0"  width="68" height="36" rx="4"/>
      <rect class="thread" x="76"  y="0"  width="68" height="36" rx="4"/>
      <rect class="thread" x="152" y="0"  width="68" height="36" rx="4"/>
      <rect class="thread" x="0"   y="44" width="68" height="36" rx="4"/>
      <rect class="thread" x="76"  y="44" width="68" height="36" rx="4"/>
      <rect class="thread" x="152" y="44" width="68" height="36" rx="4"/>
      <rect class="thread" x="0"   y="88" width="68" height="36" rx="4"/>
      <rect class="thread" x="76"  y="88" width="68" height="36" rx="4"/>
      <rect class="thread" x="152" y="88" width="68" height="36" rx="4"/>
    </g>
    <text class="thread-t" x="34"  y="23" text-anchor="middle">T00: +</text>
    <text class="thread-t" x="110" y="23" text-anchor="middle">T01: +</text>
    <text class="thread-t" x="186" y="23" text-anchor="middle">T02: +</text>
    <text class="thread-t" x="34"  y="67" text-anchor="middle">T10: +</text>
    <text class="thread-t" x="110" y="67" text-anchor="middle">T11: +</text>
    <text class="thread-t" x="186" y="67" text-anchor="middle">T12: +</text>
    <text class="thread-t" x="34"  y="111" text-anchor="middle">T20: +</text>
    <text class="thread-t" x="110" y="111" text-anchor="middle">T21: +</text>
    <text class="thread-t" x="186" y="111" text-anchor="middle">T22: +</text>
  </g>

  <!-- Arrow to C -->
  <path class="arrow" d="M630 124 H670"/>

  <!-- Output C -->
  <g transform="translate(680, 70)">
    <text class="label" x="54" y="-10" text-anchor="middle">C</text>
    <rect class="mat-fill" x="0" y="0" width="108" height="108" rx="4"/>
    <rect class="mat-stroke" x="0" y="0" width="108" height="108" rx="4"/>
    <path d="M36 0 V108 M72 0 V108 M0 36 H108 M0 72 H108" stroke="#0ea5e9" stroke-opacity="0.35"/>
    <rect class="hl" x="0" y="0" width="36" height="36"/>
    <rect class="hl" x="36" y="0" width="36" height="36"/>
    <rect class="hl" x="72" y="0" width="36" height="36"/>
    <rect class="hl" x="0" y="36" width="36" height="36"/>
    <rect class="hl" x="36" y="36" width="36" height="36"/>
    <rect class="hl" x="72" y="36" width="36" height="36"/>
    <rect class="hl" x="0" y="72" width="36" height="36"/>
    <rect class="hl" x="36" y="72" width="36" height="36"/>
    <rect class="hl" x="72" y="72" width="36" height="36"/>
    <text class="cell" x="18" y="23" text-anchor="middle">c00</text>
    <text class="cell" x="54" y="23" text-anchor="middle">c01</text>
    <text class="cell" x="90" y="23" text-anchor="middle">c02</text>
    <text class="cell" x="18" y="59" text-anchor="middle">c10</text>
    <text class="cell" x="54" y="59" text-anchor="middle">c11</text>
    <text class="cell" x="90" y="59" text-anchor="middle">c12</text>
    <text class="cell" x="18" y="95" text-anchor="middle">c20</text>
    <text class="cell" x="54" y="95" text-anchor="middle">c21</text>
    <text class="cell" x="90" y="95" text-anchor="middle">c22</text>
  </g>

  <!-- Bottom caption boxes -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="400" height="90" rx="8" fill="rgba(14,165,233,0.08)" stroke="#0369a1" stroke-width="1.5"/>
    <text class="label" x="20" y="30">CPU (serial)</text>
    <text class="cap" x="20" y="54">for each (i,j):  C[i,j] = A[i,j] + B[i,j]</text>
    <text class="cap" x="20" y="76">time ~ O(mn)</text>
  </g>

  <g transform="translate(480, 220)">
    <rect x="0" y="0" width="400" height="90" rx="8" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="2"/>
    <text class="label" x="20" y="30">GPU (parallel)</text>
    <text class="cap" x="20" y="54">thread (i,j):  C[i,j] = A[i,j] + B[i,j]</text>
    <text class="cap" x="20" y="76">time ~ O(1)  with mn threads</text>
  </g>
</svg>
